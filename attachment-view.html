<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, viewport-fit=cover">
  <meta name="theme-color" content="#1A4B6B">
  <title>附圖附件</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { padding-top: 0; background: #525659; touch-action: manipulation; }
    .attach-toolbar {
      display: flex; align-items: center; gap: 0.35rem;
      padding: calc(0.55rem + env(safe-area-inset-top, 0px)) 0.6rem 0.55rem;
      background: var(--brown-deep); color: #fff;
      position: sticky; top: 0; z-index: 2; flex-wrap: wrap;
    }
    .attach-back { color: var(--gold-light); text-decoration: none; font-size: 0.85rem; white-space: nowrap; }
    .attach-title {
      flex: 1; text-align: center; font-size: 0.82rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
    }
    .attach-btn {
      background: rgba(255,255,255,0.12); border: 0; color: #fff;
      padding: 0.35rem 0.55rem; border-radius: 6px; cursor: pointer;
      font: inherit; font-size: 0.8rem; white-space: nowrap;
    }
    .attach-btn:disabled { opacity: 0.35; cursor: default; }
    .attach-btn--zoom { min-width: 2rem; font-size: 1rem; line-height: 1; padding: 0.3rem 0.45rem; }
    .attach-zoom-label { font-size: 0.72rem; min-width: 2.6rem; text-align: center; color: rgba(255,255,255,0.85); }
    .attach-moj { color: var(--gold-light); font-size: 0.78rem; text-decoration: none; white-space: nowrap; }
    .attach-wrap {
      overflow: auto; height: calc(100dvh - 48px);
      padding: 0.75rem 0.5rem 1.5rem; text-align: center;
      -webkit-overflow-scrolling: touch;
    }
    #viewport { display: inline-block; vertical-align: top; transform-origin: top center; }
    .attach-page {
      display: block; margin: 0 auto; box-shadow: 0 2px 16px rgba(0,0,0,0.35); background: #fff;
    }
    .attach-status { color: #ddd; padding: 2rem 1rem; line-height: 1.5; white-space: pre-wrap; }
    .attach-note {
      color: rgba(255,255,255,0.75); font-size: 0.75rem; padding: 0 0.6rem 0.5rem;
      background: var(--brown-deep); text-align: center;
    }
  </style>
</head>
<body>
  <div class="attach-toolbar">
    <a class="attach-back" href="javascript:history.back()">← 返回</a>
    <span class="attach-title" id="title">載入中…</span>
    <button type="button" class="attach-btn attach-btn--zoom" id="zoomOut" aria-label="縮小">−</button>
    <span class="attach-zoom-label" id="zoomLabel">100%</span>
    <button type="button" class="attach-btn attach-btn--zoom" id="zoomIn" aria-label="放大">+</button>
    <button type="button" class="attach-btn" id="zoomFit">適寬</button>
    <button type="button" class="attach-btn" id="prev" disabled>上一頁</button>
    <button type="button" class="attach-btn" id="next" disabled>下一頁</button>
    <a class="attach-moj" id="mojLink" href="#">MOJ 原文</a>
  </div>
  <p class="attach-note" id="note" hidden></p>
  <div class="attach-wrap" id="wrap">
    <div id="viewport"><p class="attach-status" id="status">載入中…</p></div>
  </div>
  <script src="js/data.js?v=2026090322"></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      const att = ATTACHMENTS.find((a) => a.id === id);
      const titleEl = document.getElementById('title');
      const wrap = document.getElementById('wrap');
      const viewport = document.getElementById('viewport');
      const statusEl = document.getElementById('status');
      const noteEl = document.getElementById('note');
      const prevBtn = document.getElementById('prev');
      const nextBtn = document.getElementById('next');
      const zoomInBtn = document.getElementById('zoomIn');
      const zoomOutBtn = document.getElementById('zoomOut');
      const zoomFitBtn = document.getElementById('zoomFit');
      const zoomLabel = document.getElementById('zoomLabel');
      const mojLink = document.getElementById('mojLink');
      let page = Math.max(1, parseInt(params.get('page') || '1', 10));
      let zoom = 1;
      let fitScale = 1;
      let naturalW = 0;

      if (!att || !att.pages || !att.pages.length) {
        titleEl.textContent = '找不到附件';
        statusEl.textContent = '找不到指定的附圖或附件。';
        return;
      }

      document.title = att.label;
      titleEl.textContent = att.label;
      mojLink.href = att.mojUrl;
      mojLink.addEventListener('click', (e) => {
        if (location.protocol !== 'file:') return;
        e.preventDefault();
        if (window.Android && Android.openExternal) Android.openExternal(att.mojUrl);
        else window.open(att.mojUrl, '_blank');
      });
      if (att.id.startsWith('att')) {
        noteEl.hidden = false;
        noteEl.textContent = '附件二～四採用向量版表單，可縮放查閱；亦可點「MOJ 原文」開啟官方 PDF。';
      }

      function updateZoomLabel() {
        zoomLabel.textContent = Math.round(zoom * 100) + '%';
      }

      function applySize() {
        const el = viewport.querySelector('.attach-page');
        if (!el || !naturalW) return;
        const w = naturalW * fitScale * zoom;
        el.style.width = w + 'px';
        el.style.height = 'auto';
        el.style.maxWidth = 'none';
      }

      function render() {
        const total = att.pages.length;
        page = Math.min(Math.max(page, 1), total);
        const src = att.pages[page - 1];
        const isSvg = src.endsWith('.svg');
        viewport.innerHTML = '';
        let el;
        if (isSvg) {
          el = document.createElement('img');
          el.className = 'attach-page';
          el.alt = att.label;
          el.decoding = 'async';
          el.src = src;
          el.addEventListener('error', () => {
            viewport.innerHTML = '<p class="attach-status">無法載入：' + src + '</p>';
          });
        } else {
          el = document.createElement('img');
          el.className = 'attach-page';
          el.alt = att.label + ' 第 ' + page + ' 頁';
          el.decoding = 'async';
          el.src = src;
          el.addEventListener('error', () => {
            viewport.innerHTML = '<p class="attach-status">無法載入：' + src + '</p>';
          });
        }
        const onReady = () => {
          naturalW = el.naturalWidth || el.width || 920;
          fitScale = Math.min(1, (wrap.clientWidth - 16) / naturalW);
          applySize();
        };
        el.addEventListener('load', onReady);
        if (isSvg) setTimeout(onReady, 80);
        viewport.appendChild(el);
        prevBtn.disabled = page <= 1;
        nextBtn.disabled = page >= total;
        if (total > 1) titleEl.textContent = att.label + ' (' + page + '/' + total + ')';
        updateZoomLabel();
      }

      function setZoom(v) {
        zoom = Math.min(4, Math.max(0.5, v));
        applySize();
        updateZoomLabel();
      }

      prevBtn.addEventListener('click', () => { page -= 1; zoom = 1; render(); });
      nextBtn.addEventListener('click', () => { page += 1; zoom = 1; render(); });
      zoomInBtn.addEventListener('click', () => setZoom(zoom * 1.25));
      zoomOutBtn.addEventListener('click', () => setZoom(zoom / 1.25));
      zoomFitBtn.addEventListener('click', () => setZoom(1));
      window.addEventListener('resize', applySize);
      render();
    })();
  </script>
</body>
</html>
